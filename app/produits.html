<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Produits — Sponsoring ↔ Régie</title>
  <link rel="icon" href="img/logo.jpg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main>
    <div class="titre-page">
      <div>
        <div class="surtitre">Fiches produit</div>
        <h1>Produits</h1>
        <p class="doux">Chaque fiche liste les sponsors du produit et les demandes à y ajouter.</p>
      </div>
    </div>

    <!-- Produits qui ont des demandes à ajouter -->
    <div class="carte encart-regie" id="bloc-a-ajouter" hidden style="margin-bottom:1.25rem">
      <h3>Demandes à ajouter</h3>
      <div class="liens-a-ajouter" id="a-ajouter"></div>
    </div>

    <div class="filtres">
      <input type="search" id="recherche" placeholder="Rechercher un produit (ex. goal, 6M, pause…)">
    </div>

    <div id="categories"><p class="doux">Chargement…</p></div>
  </main>
  <script type="module" src="js/produits.js"></script>
</body>
</html>
