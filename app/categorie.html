<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catégorie — Sponsoring ↔ Régie</title>
  <link rel="icon" href="img/logo.jpg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main>
    <div class="titre-page">
      <div>
        <div class="surtitre">Vue d'ensemble</div>
        <h1 id="c-nom">Chargement…</h1>
        <p class="doux" id="c-resume"></p>
      </div>
    </div>
    <nav class="onglets-produits" id="onglets-produits" aria-label="Fiches produit" hidden></nav>

    <div class="filtres">
      <div class="onglets" id="onglets">
        <button data-vue="toutes" class="actif">Toutes</button>
        <button data-vue="vendues">Vendues</button>
        <button data-vue="libres">Libres</button>
      </div>
      <input type="search" id="recherche" placeholder="Rechercher une scène ou un sponsor…">
    </div>

    <div class="carte" style="padding:0; overflow:hidden">
      <div class="tableau-conteneur">
        <table class="tableau">
          <thead>
            <tr>
              <th id="col-produit">Produit</th>
              <th>Sponsor</th>
              <th class="col-optionnelle">Quand</th>
              <th class="col-optionnelle">Visuel</th>
              <th class="col-optionnelle">Remarques</th>
            </tr>
          </thead>
          <tbody id="lignes"></tbody>
        </table>
      </div>
      <div class="vide" id="vide" hidden>Aucun produit ne correspond.</div>
    </div>
  </main>
  <script type="module" src="js/categorie.js"></script>
</body>
</html>
