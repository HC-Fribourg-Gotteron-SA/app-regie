<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion — Sponsoring ↔ Régie</title>
  <link rel="icon" href="img/logo.jpg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="centre">
    <div class="carte etroite carte-connexion">
      <div class="bandeau">
        <span class="marque-logo">HCFG<img src="img/logo.jpg" alt="HC Fribourg-Gottéron" onerror="this.remove()"></span>
        <div>
          <h1>Sponsoring ↔ Régie</h1>
          <p>HC Fribourg-Gottéron</p>
        </div>
      </div>
      <div class="contenu">

      <div id="message" class="message" hidden></div>

      <!-- Connexion -->
      <form id="form-connexion" novalidate>
        <div class="champ">
          <label for="email">Adresse e-mail</label>
          <input type="email" id="email" autocomplete="username" placeholder="prenom.nom@fribourg-gotteron.ch" required>
        </div>
        <div class="champ">
          <label for="mdp">Mot de passe</label>
          <input type="password" id="mdp" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-principal btn-large" id="btn-connexion">Se connecter</button>
        <div class="bas-formulaire">
          <button type="button" class="lien-bouton" id="lien-oubli">Mot de passe oublié ?</button>
        </div>
      </form>

      <!-- Mot de passe oublié -->
      <form id="form-oubli" novalidate hidden>
        <p>Indiquez votre adresse : vous recevrez un lien pour choisir un nouveau mot de passe.</p>
        <div class="champ">
          <label for="email-oubli">Adresse e-mail</label>
          <input type="email" id="email-oubli" autocomplete="username" required>
        </div>
        <button type="submit" class="btn btn-principal btn-large" id="btn-oubli">Envoyer le lien</button>
        <div class="bas-formulaire">
          <button type="button" class="lien-bouton" id="lien-retour">← Retour à la connexion</button>
        </div>
      </form>
      </div>
    </div>
  </main>
  <script type="module" src="js/connexion.js"></script>
</body>
</html>
